name: Stage 6 public synthetic checks
on:
  push:
    paths:
      - 'src/**'
      - 'api/**'
      - 'web/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/stage6.yml'
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . && python -m pip install -r api/requirements.txt && python -m pip install pytest httpx
      - run: PYTHONPATH=src:. python -m pytest -q api/tests tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
