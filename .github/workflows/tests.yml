name: Code checks (synthetic data only)
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install library and tests
        run: python -m pip install -e '.[dev]'
      - name: Public repository preflight
        run: python scripts/check_public_repository.py
      - name: Unit tests (no patient data)
        run: pytest -q
